<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-Time Object Detection</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="header" style="display: none;">
    <h1>Real-Time Object Detection</h1>
    <button id="logoutBtn">Logout</button>
  </header>
  <main>
    <div id="loginSection" class="auth-container">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="loginEmail">Email:</label>
        <input type="email" id="loginEmail" required />
        <label for="loginPassword">Password:</label>
        <input type="password" id="loginPassword" required />
        <button type="submit">Login</button>
      </form>
      <p>Don't have an account? <button id="showRegister" type="button">Register here</button></p>
    </div>
    <div id="registerSection" class="auth-container" style="display: none;">
      <h2>Register</h2>
      <form id="registerForm">
        <label for="registerEmail">Email:</label>
        <input type="email" id="registerEmail" required />
        <label for="registerPassword">Password:</label>
        <input type="password" id="registerPassword" required />
        <button type="submit">Register</button>
      </form>
      <p>Already have an account? <button id="showLogin" type="button">Login here</button></p>
    </div>
    <div id="detectionSection" style="display: none;">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
